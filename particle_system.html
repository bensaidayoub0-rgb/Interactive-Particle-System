<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Particle System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            cursor: crosshair;
        }
        canvas { display: block; }

        .ui-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(10, 10, 20, 0.85);
            border: 1px solid rgba(100, 100, 255, 0.2);
            border-radius: 16px;
            padding: 20px;
            color: #e0e0ff;
            backdrop-filter: blur(12px);
            min-width: 260px;
            z-index: 100;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        .ui-panel h2 {
            font-size: 18px;
            margin-bottom: 16px;
            color: #a0a0ff;
            letter-spacing: 1px;
        }
        .control-group {
            margin-bottom: 14px;
        }
        .control-group label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 6px;
            color: #8888cc;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .control-group input[type="range"] {
            width: 100%;
            -webkit-appearance: none;
            height: 6px;
            border-radius: 3px;
            background: #1a1a3a;
            outline: none;
        }
        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #6666ff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(100, 100, 255, 0.5);
        }
        .mode-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .mode-btn {
            padding: 6px 12px;
            border: 1px solid rgba(100, 100, 255, 0.3);
            background: rgba(20, 20, 50, 0.6);
            color: #8888cc;
            border-radius: 8px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.3s;
        }
        .mode-btn:hover, .mode-btn.active {
            background: rgba(100, 100, 255, 0.3);
            color: #fff;
            border-color: #6666ff;
        }
        .stats {
            position: fixed;
            bottom: 20px;
            right: 20px;
            color: rgba(100, 100, 255, 0.5);
            font-size: 12px;
            text-align: right;
            font-family: monospace;
        }
        .hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(150, 150, 255, 0.4);
            font-size: 13px;
            pointer-events: none;
            text-align: center;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="ui-panel">
        <h2>🌌 Particle Lab</h2>

        <div class="control-group">
            <label>Particle Count <span id="countVal">300</span></label>
            <input type="range" id="particleCount" min="50" max="800" value="300">
        </div>

        <div class="control-group">
            <label>Connection Distance <span id="connVal">120</span></label>
            <input type="range" id="connDist" min="50" max="250" value="120">
        </div>

        <div class="control-group">
            <label>Mouse Force <span id="forceVal">50</span></label>
            <input type="range" id="mouseForce" min="10" max="150" value="50">
        </div>

        <div class="control-group">
            <label>Speed <span id="speedVal">1.0</span></label>
            <input type="range" id="speed" min="0.2" max="3" step="0.1" value="1">
        </div>

        <div class="control-group">
            <label>Behavior Mode</label>
            <div class="mode-buttons">
                <button class="mode-btn active" data-mode="flock">Flock</button>
                <button class="mode-btn" data-mode="gravity">Gravity</button>
                <button class="mode-btn" data-mode="vortex">Vortex</button>
                <button class="mode-btn" data-mode="chaos">Chaos</button>
            </div>
        </div>

        <div class="control-group">
            <label>Color Theme</label>
            <div class="mode-buttons">
                <button class="mode-btn active" data-theme="nebula">Nebula</button>
                <button class="mode-btn" data-theme="fire">Fire</button>
                <button class="mode-btn" data-theme="ocean">Ocean</button>
                <button class="mode-btn" data-theme="matrix">Matrix</button>
            </div>
        </div>
    </div>

    <div class="stats" id="stats">FPS: 60 | Particles: 300</div>
    <div class="hint">Click & drag to attract • Right-click to repel • Scroll to zoom</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W, H;
let particles = [];
let mouse = { x: -1000, y: -1000, isDown: false, isRight: false };
let mode = 'flock';
let theme = 'nebula';
let frameCount = 0;
let lastTime = performance.now();

// UI Controls
const controls = {
    count: document.getElementById('particleCount'),
    connDist: document.getElementById('connDist'),
    mouseForce: document.getElementById('mouseForce'),
    speed: document.getElementById('speed')
};

const themes = {
    nebula: { hueBase: 240, hueRange: 60, sat: 70, light: 60 },
    fire: { hueBase: 15, hueRange: 40, sat: 90, light: 55 },
    ocean: { hueBase: 190, hueRange: 40, sat: 80, light: 55 },
    matrix: { hueBase: 120, hueRange: 20, sat: 100, light: 50 }
};

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

class Particle {
    constructor() {
        this.reset();
    }

    reset() {
        this.x = Math.random() * W;
        this.y = Math.random() * H;
        this.vx = (Math.random() - 0.5) * 2;
        this.vy = (Math.random() - 0.5) * 2;
        this.radius = Math.random() * 2.5 + 1;
        this.baseRadius = this.radius;
        this.mass = this.radius;
        this.hue = Math.random() * themes[theme].hueRange + themes[theme].hueBase;
        this.life = Math.random() * 100 + 50;
        this.maxLife = this.life;
        this.pulse = Math.random() * Math.PI * 2;
    }

    update() {
        const speed = parseFloat(controls.speed.value);
        const force = parseFloat(controls.mouseForce.value);

        // Mouse interaction
        const dx = mouse.x - this.x;
        const dy = mouse.y - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < 300 && dist > 1) {
            const f = (force * 50) / (dist * dist);
            const dir = mouse.isRight ? -1 : 1;
            this.vx += (dx / dist) * f * dir * 0.1;
            this.vy += (dy / dist) * f * dir * 0.1;
        }

        // Mode behaviors
        switch(mode) {
            case 'gravity':
                this.vy += 0.05 * speed;
                if (this.y > H - 10) {
                    this.vy *= -0.7;
                    this.y = H - 10;
                }
                break;

            case 'vortex':
                const cx = W / 2, cy = H / 2;
                const vdx = this.x - cx, vdy = this.y - cy;
                const vdist = Math.sqrt(vdx * vdx + vdy * vdy);
                if (vdist > 1) {
                    this.vx += (-vdy / vdist) * 0.3 * speed;
                    this.vy += (vdx / vdist) * 0.3 * speed;
                    this.vx -= (vdx / vdist) * 0.02 * speed;
                    this.vy -= (vdy / vdist) * 0.02 * speed;
                }
                break;

            case 'chaos':
                this.vx += (Math.random() - 0.5) * 0.5 * speed;
                this.vy += (Math.random() - 0.5) * 0.5 * speed;
                break;

            case 'flock':
            default:
                // Gentle wandering
                this.vx += (Math.random() - 0.5) * 0.1 * speed;
                this.vy += (Math.random() - 0.5) * 0.1 * speed;
                break;
        }

        // Friction
        this.vx *= 0.99;
        this.vy *= 0.99;

        // Speed limit
        const maxSpeed = 4 * speed;
        const spd = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
        if (spd > maxSpeed) {
            this.vx = (this.vx / spd) * maxSpeed;
            this.vy = (this.vy / spd) * maxSpeed;
        }

        // Update position
        this.x += this.vx * speed;
        this.y += this.vy * speed;

        // Wrap around edges (except gravity mode)
        if (mode !== 'gravity') {
            if (this.x < -10) this.x = W + 10;
            if (this.x > W + 10) this.x = -10;
            if (this.y < -10) this.y = H + 10;
            if (this.y > H + 10) this.y = -10;
        } else {
            if (this.x < 0) { this.x = 0; this.vx *= -0.7; }
            if (this.x > W) { this.x = W; this.vx *= -0.7; }
        }

        // Pulse effect
        this.pulse += 0.05;
        this.radius = this.baseRadius + Math.sin(this.pulse) * 0.5;

        // Life cycle
        this.life--;
        if (this.life <= 0) {
            this.reset();
        }
    }

    draw() {
        const t = themes[theme];
        const lifeRatio = this.life / this.maxLife;
        const alpha = lifeRatio * 0.8 + 0.2;

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${this.hue}, ${t.sat}%, ${t.light}%, ${alpha})`;
        ctx.fill();

        // Glow
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius * 3, 0, Math.PI * 2);
        const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius * 3);
        g.addColorStop(0, `hsla(${this.hue}, ${t.sat}%, ${t.light}%, ${alpha * 0.3})`);
        g.addColorStop(1, `hsla(${this.hue}, ${t.sat}%, ${t.light}%, 0)`);
        ctx.fillStyle = g;
        ctx.fill();
    }
}

function initParticles() {
    const count = parseInt(controls.count.value);
    particles = [];
    for (let i = 0; i < count; i++) {
        particles.push(new Particle());
    }
}

function drawConnections() {
    const connDist = parseInt(controls.connDist.value);
    const t = themes[theme];

    for (let i = 0; i < particles.length; i++) {
        let connections = 0;
        for (let j = i + 1; j < particles.length && connections < 3; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < connDist) {
                connections++;
                const alpha = (1 - dist / connDist) * 0.3;
                ctx.beginPath();
                ctx.moveTo(particles[i].x, particles[i].y);
                ctx.lineTo(particles[j].x, particles[j].y);
                ctx.strokeStyle = `hsla(${t.hueBase}, ${t.sat}%, ${t.light}%, ${alpha})`;
                ctx.lineWidth = 0.5;
                ctx.stroke();
            }
        }
    }
}

function drawBackground() {
    ctx.fillStyle = 'rgba(10, 10, 15, 0.15)';
    ctx.fillRect(0, 0, W, H);
}

function animate() {
    drawBackground();

    // Draw connections first (behind particles)
    drawConnections();

    // Update and draw particles
    for (const p of particles) {
        p.update();
        p.draw();
    }

    // FPS counter
    frameCount++;
    const now = performance.now();
    if (now - lastTime >= 1000) {
        document.getElementById('stats').textContent = 
            `FPS: ${frameCount} | Particles: ${particles.length} | Mode: ${mode}`;
        frameCount = 0;
        lastTime = now;
    }

    requestAnimationFrame(animate);
}

// Mouse events
canvas.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});

canvas.addEventListener('mousedown', e => {
    mouse.isDown = true;
    mouse.isRight = e.button === 2;
});

canvas.addEventListener('mouseup', () => {
    mouse.isDown = false;
    mouse.isRight = false;
});

canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('mouseleave', () => {
    mouse.x = -1000;
    mouse.y = -1000;
});

// UI event listeners
Object.keys(controls).forEach(key => {
    controls[key].addEventListener('input', e => {
        const displayId = key === 'count' ? 'countVal' : 
                         key === 'connDist' ? 'connVal' : 
                         key === 'mouseForce' ? 'forceVal' : 'speedVal';
        document.getElementById(displayId).textContent = e.target.value;
        if (key === 'count') initParticles();
    });
});

// Mode buttons
document.querySelectorAll('[data-mode]').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('[data-mode]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        mode = btn.dataset.mode;
        // Reset velocities for smooth transition
        particles.forEach(p => {
            p.vx *= 0.3;
            p.vy *= 0.3;
        });
    });
});

// Theme buttons
document.querySelectorAll('[data-theme]').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('[data-theme]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        theme = btn.dataset.theme;
        particles.forEach(p => {
            const t = themes[theme];
            p.hue = Math.random() * t.hueRange + t.hueBase;
        });
    });
});

// Touch support
canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    const touch = e.touches[0];
    mouse.x = touch.clientX;
    mouse.y = touch.clientY;
    mouse.isDown = true;
}, { passive: false });

canvas.addEventListener('touchend', () => {
    mouse.isDown = false;
    mouse.x = -1000;
    mouse.y = -1000;
});

// Initialize
initParticles();
animate();
</script>
</body>
</html>
